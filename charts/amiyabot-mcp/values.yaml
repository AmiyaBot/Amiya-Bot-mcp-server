replicaCount: 1

image:
  repository: hsyhhssyy/amiyabot-mcp
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# PreStop 最多等待 840 秒让 Git/解压/原子发布事务完成，额外保留 60 秒退出应用。
terminationGracePeriodSeconds: 900

podSecurityContext:
  fsGroup: 1000

securityContext: {}

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: ""
  annotations: {}
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

config:
  baseUrl: "https://amiyabot.example.com/"
  gameDataRepo: "https://gitee.com/amiya-bot/amiya-bot-assets.git"
  commandServiceUrl: ""
  mcpDnsRebindingProtectionEnabled: false
  remoteAssetDownloadConcurrency: 3
  searchCardCacheMaxEntries: 128
  searchCardCacheMaxBytes: 268435456
  searchCardCacheMaxEntryBytes: 16777216
  logLevel: "DEBUG"

resources: {}

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60

nodeSelector: {}

tolerations: []

affinity: {}
