replicaCount: 1

image:
  repository: hsyhhssyy/amiyabot-mcp
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext: {}

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: ""
  annotations: {}
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

config:
  baseUrl: "https://amiyabot.example.com/"
  gameDataRepo: "https://gitee.com/amiya-bot/amiya-bot-assets.git"
  commandServiceUrl: ""
  mcpDnsRebindingProtectionEnabled: false
  logLevel: "DEBUG"

resources: {}

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60

nodeSelector: {}

tolerations: []

affinity: {}
